  "@types/node": 20.19.43
  "@types/react": 19.2.18
  drizzle-orm: 0.45.2
  next: 15.5.25
  postgres: 3.4.9
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 3.4.19
  typescript: 5.9.3
  vitest: 4.1.11
  zod: 4.5.4
